{% extends "base.html" %}
{% block title %}{{ code }} · Vendor Onboarding{% endblock %}

{% block content %}
<div class="rounded-lg border border-dashed border-slate-300 bg-white px-6 py-16 text-center">
  <p class="text-3xl font-semibold text-slate-300">{{ code }}</p>
  <p class="mt-3 text-sm font-medium text-slate-700">{{ message }}</p>
  <p class="mx-auto mt-2 max-w-sm text-sm text-slate-400">
    <a href="/dashboard" class="underline hover:text-slate-600">Back to the dashboard</a>
    or <a href="/" class="underline hover:text-slate-600">submit a new vendor</a>.
  </p>
</div>
{% endblock %}
